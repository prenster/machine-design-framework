axes:
  x_carrier:
    type: servo
    actuation_reason: "test fixture"
    vmax: 100000
    amax: 10000000
    segments:
      - {law: dwell,  from: 0,   to: 45,  at: 0}
      - {law: poly5,  from: 45,  to: 90,  s0: 0,   s1: 25,  v0: 0, v1: 1.111111}
      - {law: linear, from: 90,  to: 180, s0: 25,  s1: 125}
      - {law: poly5,  from: 180, to: 360, s0: 125, s1: 0,   v0: 1.111111, v1: 0}
  z_carrier:
    type: servo
    actuation_reason: "test fixture"
    vmax: 100000
    amax: 10000000
    segments:
      - {law: dwell, from: 0, to: 360, at: 0}
  conveyor:
    type: servo
    actuation_reason: "test fixture"
    incremental_pitch: 400
    vmax: 100000
    amax: 10000000
    segments:
      - {law: poly5,  from: 0,   to: 90,  s0: 0,   s1: 50,  v0: 0, v1: 1.111111}
      - {law: linear, from: 90,  to: 180, s0: 50,  s1: 150}
      - {law: poly5,  from: 180, to: 360, s0: 150, s1: 400, v0: 1.111111, v1: 0}
valves:
  grip: {"on": 0, "off": 135, on_delay: 0, off_delay: 0, kind: vacuum}
