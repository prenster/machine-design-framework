carrier:
  x_axis: x_carrier
  z_axis: z_carrier
  bodies:
    - {id: plate, polygon: [[0, 1], [50, 1], [50, 5], [0, 5]]}
product:
  id: part
  polygon: [[0, 0], [50, 0], [50, 1], [0, 1]]
  grip_valve: grip
  placed_until: 300
  placed_frame: conveyor
frames:
  conveyor: {x: conveyor, product_ref: [-25, 0]}
moving:
  - {id: cleat, frame: conveyor, polygon: [[200, -10], [205, -10], [205, -2], [200, -2]], repeat_upstream: 1}
static: []
ports:
  pick:  {x: 0, z: 0, tol_x: 0.3, tol_z: 0.05}
  place: {x: 100, z: 0, tol_x: 1000, tol_z: 0.05}
handoffs:
  - {id: HO-DROP, from: carrier, to: conveyor, at: grip.off, tol_mm: 0.3, vel_tol_mm_s: 5}
clearance:
  default_min_mm: 2.0
  step_deg: 1.0
  rules:
    - {between: [part_placed, cleat], min_mm: 0.0, window: [0, 360]}
    - {between: [plate, part_placed], min_mm: 0.0, window: [130, 240], why: "plate rides on the part after the flying release until the carrier decelerates away"}
