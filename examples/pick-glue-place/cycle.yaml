# MASTER TIMING DIAGRAM - pick-glue-place station
# Every axis is a function of machine angle (0-360 deg = one cycle).
# This file generates the PLC cam tables (MOVIKIT Camming / SoftMotion) and drives the simulation.
# Change motion HERE, never in PLC code.
machine_angle: "0 deg = carrier parked at pick port, vacuum off"
actuation_preference: [mechanical_cam, servo, pneumatic]

axes:
  x_transfer:
    type: servo
    unit: mm
    drive: "SEW MOVI-C servo + belt-driven linear module (catalog)"
    module: X_MODULE
    motor: X_MOTOR
    superimposed:
      tag: rXOffset
      blend: [150, 205]
      return_blend: [270, 335]
      range: [0, 15]
      case_param: x_offset_case_mm
      note: "per-book registration offset from the binder, blended in during the move to the place port"
    actuation_reason: "per-book registration offset every cycle (a cam can't change shape between cycles); 600 mm stroke with a constant-velocity glue segment: a plate cam would be ~1.3 m across; a cam-driven linkage/rack is possible but heavier and format-locked"
    vmax: x_vmax_mm_s
    amax: x_amax_mm_s2
    segments:
      - {law: dwell,     from: 0,   to: 50,  at: 0,   note: "pick: vacuum builds, Z lifts first"}
      - {law: poly5,     from: 50,  to: 110, s0: 0,   s1: 260, v0: 0,   v1: 2.0, note: "accelerate into constant-velocity glue pass"}
      - {law: linear,    from: 110, to: 150, s0: 260, s1: 340, note: "glue pass at constant velocity, 2.0 mm/deg"}
      - {law: poly5,     from: 150, to: 210, s0: 340, s1: 600, v0: 2.0, v1: 0, note: "to place port; Z is up before the sheet reaches the backstop"}
      - {law: dwell,     from: 210, to: 255, at: 600, note: "place: Z descends, vacuum releases, press; X leaves once the plate is ~10 mm up"}
      - {law: cycloidal, from: 255, to: 345, s0: 600, s1: 0, note: "unloaded return; 90 deg keeps peak accel under the ELGA-80 50 m/s2 rating"}
      - {law: dwell,     from: 345, to: 360, at: 0}

  z_lift:
    type: servo
    unit: mm
    drive: "SEW MOVI-C servo + ball-screw lift (catalog)"
    module: Z_MODULE
    motor: Z_MOTOR
    rides_on: x_transfer
    actuation_reason: "rides on the X carriage; a cam would need a moving camshaft or a stationary barrel cam + track along 600 mm. Revisit if X becomes a cam-driven linkage"
    vmax: z_vmax_mm_s
    amax: z_amax_mm_s2
    segments:
      - {law: dwell,     from: 0,   to: 30,  at: 0,  note: "down on stack"}
      - {law: cycloidal, from: 30,  to: 60,  s0: 0,  s1: 15, note: "lift clear of stack fence before X moves far"}
      - {law: dwell,     from: 60,  to: 85,  at: 15}
      - {law: cycloidal, from: 85,  to: 110, s0: 15, s1: 0, note: "down to glue-pass height"}
      - {law: dwell,     from: 110, to: 150, at: 0,  note: "glue pass: 1.0 mm over nozzle"}
      - {law: cycloidal, from: 150, to: 175, s0: 0,  s1: 15}
      - {law: dwell,     from: 175, to: 195, at: 15}
      - {law: cycloidal, from: 195, to: 220, s0: 15, s1: 0, note: "place descent, X already parked"}
      - {law: dwell,     from: 220, to: 240, at: 0,  note: "release + press"}
      - {law: cycloidal, from: 240, to: 265, s0: 0,  s1: 15}
      - {law: dwell,     from: 265, to: 330, at: 15}
      - {law: cycloidal, from: 330, to: 360, s0: 15, s1: 0}

  jogger:
    type: mechanical_cam
    unit: mm
    drive: "plate cam on the station camshaft, IKO CF10 roller, spring return"
    vmax: 500
    amax: 20000
    cam:
      follower: translating_roller
      base_radius_mm: 45
      offset_mm: 0
      closure: force
      spring: {rate_n_per_mm: 2.0, preload_n: 40}
      external_load_n: 15
      roller_part: CAM_FOLLOWER_JOG
      cam_part: CAM_JOG
      driven_by: CAMSHAFT_DRIVE
      limits: {pressure_angle_deg: 30, curvature_ratio_min: 2.0, jump_margin_n: 10, roller_life_h: 20000}
    segments:
      - {law: dwell,     from: 0,   to: 150, at: 0,  note: "retracted"}
      - {law: cycloidal, from: 150, to: 190, s0: 0, s1: 8, note: "push signature against the backstop"}
      - {law: dwell,     from: 190, to: 245, at: 8,  note: "hold square during place and press"}
      - {law: cycloidal, from: 245, to: 285, s0: 8, s1: 0, note: "spring return"}
      - {law: dwell,     from: 285, to: 360, at: 0}

park_angle: 355

sensors:
  vac_ok:       {check_at: 26, signal: xVacOk,       note: "vacuum confirmed before Z lifts at 30 deg"}
  double_sheet: {check_at: 75, signal: xDoubleSheet, note: "sensor reads the gripped sheet after lift, before glue"}
  host_book:    {check_at: 5,   signal: xHostBookPresent, note: "decide before VACUUM_ON (10 deg) whether to pick"}
  host_spine:   {check_at: 140, signal: rHostSpineOffset, note: "per-book offset sampled before the X offset blend starts (150 deg)"}
  bead_ok:      {check_at: 148, signal: xBeadOk,      note: "bead passes the sensor at x=345 near the end of the glue pass, before Z lifts"}

valves:
  vacuum:
    kind: vacuum
    device: "vacuum generator + blow-off (catalog, e.g. Schmalz/Piab compact ejector)"
    "on": 10
    "off": 222
    on_delay: vac_on_delay_ms
    off_delay: vac_off_delay_ms
  glue_gun:
    kind: glue
    device: "cold-glue jet valve (catalog)"
    "on": 128.64
    "off": 130.4
    on_delay: glue_on_delay_ms
    off_delay: glue_off_delay_ms
    note: "commanded angles set for nominal speed; delays shift the bead with speed - GLUE-BEAD checks all speeds"
