station: "Example station: endsheet pick - glue - place"
description: >
  Illustrative station, not a production design. Picks one endsheet from a stack with a vacuum
  plate, passes it over a glue jet to lay a bead along its trailing edge, and places it registered
  onto a signature. Side-view planar model only.
requirements:
  - id: REQ-PROC-001
    text: "Place the endsheet with its trailing edge within +/-0.3 mm of the signature registration point."
    category: process
    source: chief engineer
    verification: {method: check, ref: [PROD-PLACE, STK-REGISTRATION]}
  - id: REQ-PROC-002
    text: "Glue bead 3-7 mm from the trailing edge (+/-1 mm) at every production speed; no glue on the machine."
    category: process
    verification: {method: check, ref: GLUE-BEAD}
  - id: REQ-PROC-003
    text: "Nozzle-to-sheet gap 0.5-1.5 mm during the glue shot."
    category: process
    verification: {method: check, ref: GLUE-BEAD}
  - id: REQ-PROC-004
    text: "Pick exactly one sheet; vacuum established before the carrier leaves the stack."
    category: process
    verification: {method: check, ref: PROD-PICK}
  - id: REQ-PROC-005
    text: "Double-sheet pick rate below 1 in 2,000 on both production endsheet stocks."
    category: process
    rationale: "Sim cannot model air infiltration and sheet-to-sheet adhesion. Physical only."
    verification: {method: test, ref: PT-06}
  - id: REQ-PROC-006
    text: "Sheet does not shift on the vacuum plate during transfer."
    category: process
    verification: {method: check, ref: PROD-CARRY}
  - id: REQ-PROC-008
    text: "Every glued endsheet is checked for bead presence before placement; a missing or short bead stops the machine holding the sheet, so no unglued endsheet is ever placed."
    category: process
    source: "chief engineer, 2026-11-23 (FMEA FM-3, RPN 245)"
    verification: {method: check, ref: [SIL-GLUE-MISSING]}
  - id: REQ-PROC-009
    text: "Bead sensor detects 100% of missing beads and < 0.5% false alarms on production stock and adhesive."
    category: process
    verification: {method: test, ref: PT-12}
  - id: REQ-LINE-001
    text: "When the binder reports an empty clamp, the station skips that cycle: no pick, no glue, no placed endsheet, no fault."
    category: controls
    verification: {method: check, ref: [SIL-HOST-GAP, LINE-ICD]}
  - id: REQ-PERF-001
    text: "1,500-3,000 cycles/h, all process requirements met across the whole range."
    category: performance
    verification: {method: check, ref: [VALVE-TIMING, CYC-LIMITS]}
  - id: REQ-MECH-001
    text: "No interference anywhere in the cycle, in 3D; 2.0 mm minimum clearance except declared contact/close-approach windows."
    category: mechanical
    verification: {method: check, ref: [SWEEP-CLEARANCE, SWEEP-3D]}
  - id: REQ-MECH-002
    text: "Motion laws continuous in position and velocity; all axes within catalog drive limits at max speed."
    category: mechanical
    verification: {method: check, ref: [CYC-LAW, CYC-LIMITS]}
  - id: REQ-PROC-007
    text: "Unsupported sheet overhang deflects less than 2 mm and never touches the machine before placement."
    category: process
    verification: {method: check, ref: [SHEET-DYN, SWEEP-CLEARANCE]}
  - id: REQ-MECH-003
    text: "Every axis sized from catalog data at max speed: speed, acceleration, stroke, payload, peak and RMS torque with 1.25 margin."
    category: mechanical
    verification: {method: check, ref: BOM-SIZING}
  - id: REQ-MECH-004
    text: "All connected components are interface-compatible and every spec stated in two places agrees."
    category: mechanical
    verification: {method: check, ref: [BOM-IFACE, BOM-XREF]}
  - id: REQ-ELEC-001
    text: "Every I/O point mapped to a real channel with matching voltage and current rating; safety devices on safety-rated inputs."
    category: electrical
    verification: {method: check, ref: IO-MAP}
  - id: REQ-ELEC-002
    text: "24 VDC and compressed-air demand at max speed within 75% / 70% of supply."
    category: electrical
    verification: {method: check, ref: [C-24V-BUDGET, C-AIR-BUDGET]}
  - id: REQ-CTRL-001
    text: "PLC timing constants are generated from the cycle diagram and I/O list, never hand-edited."
    category: controls
    verification: {method: check, ref: PLC-GEN}
  - id: REQ-CTRL-002
    text: "Missing or double sheets never produce glue on the machine; a double is never glued or placed."
    category: controls
    verification: {method: check, ref: [SIL-MISSED-PICK, SIL-STACK-EMPTY, SIL-DOUBLE-SHEET]}
  - id: REQ-CTRL-003
    text: "Guard, e-stop: master and glue off within one PLC scan; gripped sheet held, not dropped."
    category: controls
    verification: {method: check, ref: [SIL-GUARD-MID-GLUE, SIL-ESTOP-IN-TRANSFER]}
  - id: REQ-CTRL-004
    text: "Production sequence meets all process requirements including PLC scan quantisation, at every speed."
    category: controls
    verification: {method: check, ref: SIL-NOMINAL}
  - id: REQ-SAFE-002
    text: "Air loss: controlled fault within 25 ms. Sheet drop on air loss is accepted only if the risk assessment accepts it."
    category: safety
    verification: {method: check, ref: SIL-AIR-LOSS}
  - id: REQ-MECH-005
    text: "The vacuum plate carries an edge stop that registers the endsheet trailing edge before transfer (STK-REGISTRATION depends on it)."
    category: mechanical
    rationale: "Stack-fence registration (+/-0.2 mm) could not close the +/-0.3 mm placement stack."
    verification: {method: review}
  - id: REQ-SAFE-003
    text: "Every hazard is mitigated; every safety function has a design PL at or above its required PL, uses safety-rated devices and is validated by a SIL scenario."
    category: safety
    verification: {method: check, ref: SAFETY}
  - id: REQ-REL-001
    text: "Every failure mode with severity >= 9 or RPN >= 100 has a design action."
    category: maintenance
    verification: {method: check, ref: FMEA}
  - id: REQ-SAFE-001
    text: "Carrier travel zone fully guarded; guard interlock stops motion per the ISO 13849 performance level set by the risk assessment."
    category: safety
    verification: {method: review}
  - id: REQ-MFG-001
    text: "All non-catalog parts makeable on a 3-axis mill or laser + brake; no tolerance tighter than +/-0.05 mm without justification."
    category: manufacturing
    verification: {method: review}
