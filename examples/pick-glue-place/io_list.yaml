# Source of truth for PLC I/O. plc/generated/GVL_IO.st is generated from this file.
signals:
  # from the motion controller (virtual master axis), not a physical channel
  - {tag: rAngle,       dir: in,  type: REAL, virtual: true, note: "machine angle 0-360 from the virtual master"}
  - {tag: rHostSpineOffset, dir: in, type: REAL, virtual: true, note: "from the binder over fieldbus (interfaces.yaml IF-SPINE-OFFSET)"}
  # outputs
  - {tag: rXOffset,     dir: out, type: REAL, virtual: true, note: "per-cycle superimposed X offset to the drive (mm)"}
  - {tag: xMasterRun,   dir: out, type: BOOL, virtual: true, note: "enable/run the cam master"}
  - {tag: xVacuum,      dir: out, type: BOOL, device: EJECTOR,    card: DO1, ch: 0, cycle_valve: vacuum, note: "ejector's integrated NC suction valve"}
  - {tag: xGlueGun,     dir: out, type: BOOL, device: GLUE_VALVE, card: DO1, ch: 1, cycle_valve: glue_gun}
  - {tag: xLampFault,   dir: out, type: BOOL, device: LAMP_FAULT, card: DO1, ch: 2}
  # inputs
  - {tag: xVacOk,       dir: in,  type: BOOL, device: EJECTOR,       card: DI1, ch: 0, note: "ejector's integrated vacuum switch"}
  - {tag: xDoubleSheet, dir: in,  type: BOOL, device: DOUBLE_SENSOR, card: DI1, ch: 1}
  - {tag: xAirOk,       dir: in,  type: BOOL, device: AIR_SWITCH,    card: DI1, ch: 2}
  - {tag: xGlueReady,   dir: in,  type: BOOL, device: GLUE_UNIT,     card: DI1, ch: 3}
  - {tag: xBeadOk,      dir: in,  type: BOOL, device: BEAD_SENSOR,   card: DI1, ch: 7, note: "bead present on the gripped sheet"}
  - {tag: xStartPb,     dir: in,  type: BOOL, device: OP_PANEL,      card: DI1, ch: 4}
  - {tag: xStopPb,      dir: in,  type: BOOL, device: OP_PANEL,      card: DI1, ch: 5}
  - {tag: xResetPb,     dir: in,  type: BOOL, device: OP_PANEL,      card: DI1, ch: 6}
  - {tag: xHostBookPresent, dir: in, type: BOOL, device: BINDER_HANDSHAKE, card: DI2, ch: 0, note: "from the binder; see interfaces.yaml"}
  - {tag: xGuardClosed, dir: in,  type: BOOL, device: GUARD_SWITCH,  card: SDI1, ch: 0}
  - {tag: xEStopOk,     dir: in,  type: BOOL, device: ESTOP,         card: SDI1, ch: 1}
